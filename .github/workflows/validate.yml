name: Validate

on:
  push:
    branches: [cgbs-att]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest tests -v
