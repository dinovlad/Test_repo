[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgbs-att"
version = "0.1.0"
description = "Continuous-dose ATT estimation and dose-specific event studies."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==1.5.3",
    "pyfixest==0.60.0",
    "scipy==1.15.2",
]

[dependency-groups]
dev = [
    "codespell",
    "mypy>=1.19.0",
    "nbqa>=1.9.0",
    "pre-commit",
    "pytest>=8.0",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["labor_cost_optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
indent-width = 4
line-length = 120
respect-gitignore = true
src = ["src"]
target-version = "py311"

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "COM", "D", "DTZ", "E", "ERA", "F", "FAST", "G",
    "ICN", "I", "INP", "ISC", "PD003", "PD004", "PD007", "PD011", "PERF",
    "PGH", "PIE", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "SIM",
    "T20", "UP", "W",
]
ignore = [
    "B905", "D205", "RUF001", "RUF002", "PD", "PTH123", "RET504", "SIM105",
    "SIM108", "UP032",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104", "F401"]
"tests/**.py" = ["D100", "D101", "D102", "D103", "INP001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*"]
ignore_missing_imports = true
