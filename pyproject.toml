[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgbs-att"
version = "0.1.0"
description = "Continuous-dose ATT estimation and dose-specific event studies."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==1.5.3",
    "pyfixest==0.60.0",
    "scipy==1.15.2",
]

[dependency-groups]
dev = [
    "codespell",
    "mypy>=1.19.0",
    "nbqa>=1.9.0",
    "pre-commit",
    "pytest>=8.0",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["labor_cost_optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*"]
ignore_missing_imports = true
